name: Python research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Gaussian / LCA model sanity
        run: python experiments/gaussian_lca_v0/test_model.py
      - name: Wave-optics and analysis tests
        working-directory: experiments/waveoptics_q1_v1
        run: python -m unittest -v test_waveoptics test_accommodation_analysis
      - name: Generate tiny media smoke test
        run: python experiments/gaussian_lca_v0/chromablur_pilot.py --out /tmp/gazebloom-pilot --width 256 --height 240 --seconds 1 --fps 4
      - name: Generate wave-optics validation smoke test
        run: python experiments/waveoptics_q1_v1/waveoptics_validation.py --out /tmp/gazebloom-q1
