name: Python research checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install Python (bounded retries for transient hosting errors)
        run: |
          for attempt in 1 2 3; do
            if uv python install "${{ matrix.python-version }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
          done
          echo "Python install failed after 3 bounded attempts" >&2
          exit 1
      - name: Validate tracked uv.lock is current
        run: uv lock --check
      - name: Sync fully isolated research environment
        run: uv sync --locked --extra research
      - name: Desktop reminder unit tests
        run: uv run --locked --extra research python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Evidence policy unit tests
        run: uv run --locked --extra research python -m unittest discover -s research -p 'test_*.py' -v
      - name: Gaussian/LCA model tests
        run: uv run --locked --extra research python experiments/gaussian_lca_v0/test_model.py
      - name: Wave-optics and analysis tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/waveoptics_q1_v1 -p 'test_*.py' -v
      - name: R1 sensitivity unit tests (model-internal)
        run: uv run --locked --extra research python -m unittest discover -s experiments/r1_model_sensitivity -p 'test_*.py' -v
      - name: R1 parameter pilot (16 cases x 2 signed directions)
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r1_model_sensitivity/sweep.py \
            --preset pilot --out "$RUNNER_TEMP/gazebloom-r1-pilot"
          cat "$RUNNER_TEMP/gazebloom-r1-pilot/summary.json"
      - name: Archive R1 model-only results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r1-pilot-simulation-only
          path: ${{ runner.temp }}/gazebloom-r1-pilot/
          if-no-files-found: error
          retention-days: 30
      - name: R2 display-inversion numerical tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r2_display_inverse -p 'test_*.py' -v
      - name: R2 nominal four-case simulation pilot (Python 3.12)
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra research python experiments/r2_display_inverse/pilot.py --out "$RUNNER_TEMP/gazebloom-r2-pilot"
      - name: Preserve R2 simulation-only pilot
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r2-pilot-simulation-only
          path: ${{ runner.temp }}/gazebloom-r2-pilot/
          if-no-files-found: error
          retention-days: 30
      - name: R3 alternative optics numerical invariants
        run: uv run --locked --extra research python -m unittest discover -s experiments/r3_model_mismatch -p 'test_*.py' -v
      - name: R3 frozen 24-case synthetic mismatch pilot
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r3_model_mismatch/evaluate.py --out "$RUNNER_TEMP/gazebloom-r3"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["rows"] == 24 and d["all_optimizers_converged"], d' "$RUNNER_TEMP/gazebloom-r3/summary.json"
          cat "$RUNNER_TEMP/gazebloom-r3/summary.json"
      - name: Archive R3 synthetic stress results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r3-synthetic-mismatch-v1
          path: ${{ runner.temp }}/gazebloom-r3/
          if-no-files-found: error
          retention-days: 30
      - name: R4 signed-template and color-order numerical tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r4_directional_controls -p 'test_*.py' -v
      - name: R4 frozen 12-pair model-only directional trial
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r4_directional_controls/evaluate.py --out "$RUNNER_TEMP/gazebloom-r4"
          python -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["rows"]==12 and s["defined_directional_rows"]==12 and s["optimizers_all_success"], s' "$RUNNER_TEMP/gazebloom-r4/summary.json"
          cat "$RUNNER_TEMP/gazebloom-r4/summary.json"
      - name: Archive R4 model-only directional outputs
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r4-signed-template-v1
          path: ${{ runner.temp }}/gazebloom-r4/
          if-no-files-found: error
          retention-days: 30
      - name: R5 equal-capacity null numerical tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r5_equal_capacity_controls -p 'test_*.py' -v
      - name: R5 independently fitted 12-pair synthetic grid
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r5_equal_capacity_controls/evaluate.py --out "$RUNNER_TEMP/gazebloom-r5"
          python -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["rows"] == 12 and s["paired_directional_rows"] == 12 and s["all_optimizers_converged"], s' "$RUNNER_TEMP/gazebloom-r5/summary.json"
          cat "$RUNNER_TEMP/gazebloom-r5/summary.json"
      - name: Archive R5 model-only equal-capacity evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r5-independent-rgb-nulls-v1
          path: ${{ runner.temp }}/gazebloom-r5/
          if-no-files-found: error
          retention-days: 30
      - name: R6 cross-model and exact proxy-matching tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r6_identifiability -p 'test_*.py' -v
      - name: R6 frozen 10-pair cross-target identifiability pilot
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r6_identifiability/evaluate.py --out "$RUNNER_TEMP/gazebloom-r6"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["rows"]==10 and d["directional_defined_rows"]==10 and d["all_optimizer_success"], d' "$RUNNER_TEMP/gazebloom-r6/summary.json"
          cat "$RUNNER_TEMP/gazebloom-r6/summary.json"
      - name: Archive R6 model-identifiability outputs
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r6-cross-model-identifiability-v1
          path: ${{ runner.temp }}/gazebloom-r6/
          if-no-files-found: error
          retention-days: 30
      - name: R7 conditioned score and target-free focus numerical tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r7_metric_validation -p 'test_*.py' -v
      - name: R7 frozen 10-pair synthetic focus pilot
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r7_metric_validation/evaluate.py --out "$RUNNER_TEMP/gazebloom-r7"
          python -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["rows"]==10 and s["all_optimizer_success"], s' "$RUNNER_TEMP/gazebloom-r7/summary.json"
          cat "$RUNNER_TEMP/gazebloom-r7/summary.json"
      - name: Archive R7 model-only focus diagnostics
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r7-conditioned-score-focus-scan-v1
          path: ${{ runner.temp }}/gazebloom-r7/
          if-no-files-found: error
          retention-days: 30
      - name: R8 frozen metric, spectrum and focus-grid unit tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r8_sensitivity -p 'test_*.py' -v
      - name: R8 full preregistered 432-row synthetic sensitivity grid
        if: matrix.python-version == '3.12'
        timeout-minutes: 35
        run: |
          uv run --locked --extra research python experiments/r8_sensitivity/evaluate.py --out "$RUNNER_TEMP/gazebloom-r8"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["rows"]==432 and d["all_optimizers_success"] and sum(x["rows"] for x in d["sensitivity_cells"].values())==432, d' "$RUNNER_TEMP/gazebloom-r8/summary.json"
          cat "$RUNNER_TEMP/gazebloom-r8/summary.json"
      - name: Archive R8 synthetic focus sensitivity
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r8-spectral-focus-sensitivity-v1
          path: ${{ runner.temp }}/gazebloom-r8/
          if-no-files-found: error
          retention-days: 30
      - name: R9 no-instrument feasibility and evidence classification unit tests
        run: uv run --locked python -m unittest discover -s experiments/r9_measurement_readiness -p 'test_*.py' -v
      - name: R9 default unknown-access readiness assessment
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked python experiments/r9_measurement_readiness/evaluate_readiness.py --inventory experiments/r9_measurement_readiness/inventory_template.json --out "$RUNNER_TEMP/gazebloom-r9/readiness.json"
          python -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["evidence_state"]=="FEASIBILITY_ONLY_NO_OBSERVATIONS" and v["readiness"]["P0_document_and_model_audit"] and not any(value for key,value in v["readiness"].items() if key!="P0_document_and_model_audit") and not v["human_participant_testing_authorized"], v' "$RUNNER_TEMP/gazebloom-r9/readiness.json"
      - name: Archive R9 evidence-gated feasibility decision
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r9-no-procurement-readiness-v1
          path: ${{ runner.temp }}/gazebloom-r9/
          if-no-files-found: error
          retention-days: 30
      - name: R10 optional phone and human-perception pilot tests (no humans)
        run: uv run --locked python -m unittest discover -s experiments/r10_human_feasibility -p 'test_*.py' -v
      - name: R10 synthetic-code dry run, no stimuli or participant data
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked python experiments/r10_human_feasibility/pilot.py plan --participant-code P000 --seed ci-dry-run-not-a-person --out "$RUNNER_TEMP/gazebloom-r10"
          python -c 'import json,sys; m=json.load(open(sys.argv[1])); assert not m["human_test_authorized_by_script"] and not m["research_stimuli_included"] and not m["camera_required"] and m["count_per_condition"]=={"X":4,"Y":4}' "$RUNNER_TEMP/gazebloom-r10/manifest.json"
      - name: Archive only the R10 test-only blank research schedule
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r10-no-human-data-dry-run
          path: ${{ runner.temp }}/gazebloom-r10/
          if-no-files-found: error
          retention-days: 30
      - name: R11 static paired candidate image generator unit tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r11_static_stimuli -p 'test_*.py' -v
      - name: R11 unapproved candidate review artifacts (never human display)
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r11_static_stimuli/generate.py --out "$RUNNER_TEMP/gazebloom-r11"
          python -c 'import json,sys,pathlib; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); assert len(d["scenes"])==4 and sum(len(s["files"]) for s in d["scenes"])==8 and not d["human_exposure_authorized"] and not d["human_participant_images_displayed"] and "MANUAL_SAFETY_AND_ETHICS_PENDING" in d["review_state"],d' "$RUNNER_TEMP/gazebloom-r11/audit_manifest.json"
          cat "$RUNNER_TEMP/gazebloom-r11/audit_manifest.json"
      - name: Archive R11 review-only static images and numeric audit
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r11-static-candidates-NOT-human-approved
          path: ${{ runner.temp }}/gazebloom-r11/
          if-no-files-found: error
          retention-days: 30
      - name: R12 readable static image and non-authorizing operator review tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r12_display_review -p 'test_*.py' -v
      - name: R12 unapproved larger-contrast PNG candidates and pending review
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r12_display_review/generate_candidates.py --out "$RUNNER_TEMP/gazebloom-r12"
          uv run --locked --extra research python experiments/r12_display_review/review_gate.py --candidates "$RUNNER_TEMP/gazebloom-r12" --review experiments/r12_display_review/review_template.json --out "$RUNNER_TEMP/gazebloom-r12/DEFAULT_PENDING_REVIEW.json"
          python -c 'import json,sys; from pathlib import Path; d=json.loads(Path(sys.argv[1]).read_text()); r=json.loads(Path(sys.argv[2]).read_text()); assert len(d["candidate_pairs"])==4 and all(not p["human_display_approved"] for p in d["candidate_pairs"]) and not d["human_exposure_authorized"] and r["review_state"]=="PENDING_REVIEW_NO_HUMAN_EXPOSURE" and not r["human_exposure_authorized"]' "$RUNNER_TEMP/gazebloom-r12/manifest.json" "$RUNNER_TEMP/gazebloom-r12/DEFAULT_PENDING_REVIEW.json"
      - name: Archive R12 candidate images unapproved for human exposure
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r12-readable-candidates-NOT-human-approved
          path: ${{ runner.temp }}/gazebloom-r12/
          if-no-files-found: error
          retention-days: 30
      - name: R13 private operator review and balanced four-scene mapping tests
        run: uv run --locked --extra research python -m unittest discover -s experiments/r13_operator_h0 -p 'test_*.py' -v
      - name: R13 synthetic-code H0-only dry run with no humans or actual monitor
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra research python experiments/r12_display_review/generate_candidates.py --out "$RUNNER_TEMP/gazebloom-r13/r12_candidates"
          uv run --locked python experiments/r10_human_feasibility/pilot.py plan --participant-code P000 --seed ci-fake-participant-no-human --out "$RUNNER_TEMP/gazebloom-r13/r10_dummy"
          uv run --locked --extra research python experiments/r13_operator_h0/workflow.py prepare-review --candidates "$RUNNER_TEMP/gazebloom-r13/r12_candidates" --out "$RUNNER_TEMP/gazebloom-r13/review_pending"
          uv run --locked --extra research python experiments/r13_operator_h0/workflow.py bind --candidates "$RUNNER_TEMP/gazebloom-r13/r12_candidates" --plan "$RUNNER_TEMP/gazebloom-r13/r10_dummy/trials.csv" --plan-manifest "$RUNNER_TEMP/gazebloom-r13/r10_dummy/manifest.json" --seed ci-fake-binding-secret-no-human --out "$RUNNER_TEMP/gazebloom-r13/binding_dummy"
          python -c 'import json,sys,csv,pathlib; r=pathlib.Path(sys.argv[1]); q=json.loads((r/"review_pending/review_status_PENDING.json").read_text()); m=json.loads((r/"binding_dummy/binding_manifest_NOT_APPROVED.json").read_text()); rows=list(csv.DictReader((r/"binding_dummy/trial_image_binding_NOT_APPROVED.csv").open())); assert q["review_state"]=="PENDING_REVIEW_NO_HUMAN_EXPOSURE" and not q["human_exposure_authorized"] and q["checkpoints_completed"]==1; assert len(rows)==8 and m["repeat_separation_trials"]==4 and not m["human_exposure_authorized"] and not m["camera_required"]; assert all(rows[i]["word"]==rows[i+4]["word"] and rows[i]["condition_code"]!=rows[i+4]["condition_code"] for i in range(4))' "$RUNNER_TEMP/gazebloom-r13"
      - name: Archive R13 artificial H0-only reviewer checklist and word binding
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gazebloom-r13-operator-plan-only-NOT-human-approved
          path: ${{ runner.temp }}/gazebloom-r13/
          if-no-files-found: error
          retention-days: 30
      - name: Generate small media
        run: uv run --locked --extra research python experiments/gaussian_lca_v0/chromablur_pilot.py --out /tmp/gazebloom-pilot --width 256 --height 240 --seconds 1 --fps 4
      - name: Generate wave-optics outputs
        run: uv run --locked --extra research python experiments/waveoptics_q1_v1/waveoptics_validation.py --out /tmp/gazebloom-q1

  ubuntu-tkinter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk bindings for Ubuntu's Python
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Verify OS interpreter has Tk
        run: /usr/bin/python3 -c 'import _tkinter, tkinter; print("system Tk:", _tkinter.TK_VERSION)'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"
      - name: Sync uv against Tk-capable system interpreter
        run: uv sync --python /usr/bin/python3 --no-managed-python
      - name: Verify uv environment preserves Tk
        run: uv run --python /usr/bin/python3 --no-managed-python python -c 'import sys, _tkinter, tkinter, gazebloom; print(sys.executable, _tkinter.TK_VERSION)'
