[project]
name = "gazebloom"
version = "0.1.0"
description = "Evidence-informed screen breaks and experimental visual optics research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
research = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.7,<4",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10,<13",
]

[project.scripts]
gazebloom = "gazebloom.desktop:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gazebloom"]
